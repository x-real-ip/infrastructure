---
# Python virtual environment for k3s pip packages
venv_dir: /opt/k3s
venv_python: "{{ venv_dir }}/bin/python"

# Primary DNS IP for debian hosts /etc/systemd/resolved.conf
primary_dns_ip: "10.0.100.1"

# IP-address of first master node
first_master_ip_address:
  "{{ hostvars[groups['k3s_master'][0]]['ansible_default_ipv4']['address'] }}"

# The location to store rendered jinja2 templates like deployments .yaml files
output_file_location: "/home/coen/Downloads/"

# k3s cluster token
k3s_token: "{{ vault_k3s_token }}"

# k3s version to install https://update.k3s.io/v1-release/channels/stable
k3s_version: "v1.36.4+k3s1"

# https://docs.k3s.io/installation/registry-mirror
embedded_registry:
  enabled: true
  # Registries to mirror. Use "*" to mirror every registry.
  mirrors:
    - "docker.io"
    - "ghcr.io"
    - "quay.io"
    - "registry.k8s.io"

argocd:
  deploy: true
  name: argocd-core
  namespace: argocd
  version: "stable"

kube_vip:
  deploy: true
  name: "kube-vip"
  namespace: "kube-system"
  image_tag: "v1.2.3" # curl -s https://api.github.com/repos/kube-vip/kube-vip/releases/latest | jq -r .tag_name
  apiserver_endpoint: "10.0.100.100"
  flannel_iface: "ens18"

sealed_secrets:
  deploy: true
  name: "sealed-secrets"
  namespace: "kube-system"
  image_tag: "0.39.1" # curl -sL https://github.com/bitnami-labs/sealed-secrets/releases/latest | grep -oP 'tag/v\K[^"]+' | head -1
  sealed_secret_customkeys_2_tls_key:
    "{{ vault_sealed_secret_customkeys_2_tls_key }}"

github_registry:
  credentials:
    deploy: true
    name: github-registry-creds
    namespaces:
      - devops
      - home-automation
      - tools
