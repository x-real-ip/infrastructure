---
- name: Wait for {{ hostvars[item]['device_name'] }} to become up
  ansible.builtin.uri:
    url: http://{{ item }}/status
    body_format: json
    return_content: true
  register: status_content
  until: status_content.status == 200 and status_content.json.uptime | int >= 10
  retries: 20
  delay: 10
  ignore_errors: true
