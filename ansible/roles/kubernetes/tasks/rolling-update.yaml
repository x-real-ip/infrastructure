---
- name: Drain node
  ansible.builtin.include_tasks: drain.yaml

- name: System update package cache
  ansible.builtin.include_role:
    name: system-update-package-cache

- name: System upgrade
  ansible.builtin.include_role:
    name: system-upgrade

# ansible.builtin.reboot already waits for the connection to come back, so no
# separate wait_for_connection is needed here.
- name: Reboot the system
  ansible.builtin.reboot:

- name: Uncordon node
  ansible.builtin.include_tasks: uncordon.yaml

- name: Wait for node to become ready
  kubernetes.core.k8s_info:
    kind: node
    label_selectors:
      - "kubernetes.io/hostname = {{ ansible_facts['hostname'] }}"
    wait: true
    wait_timeout: "{{ kubernetes_node_ready_timeout }}"
    wait_condition:
      type: Ready
      status: "True"
  delegate_to: "{{ kubernetes_control_node }}"
