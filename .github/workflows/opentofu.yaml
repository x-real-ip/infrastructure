---
name: OpenTofu

on:
  pull_request:
    paths:
      - opentofu/**
      - .github/workflows/opentofu.yaml
  push:
    branches:
      - main
    paths:
      - opentofu/**
      - .github/workflows/opentofu.yaml

jobs:
  validate:
    name: Validate ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - proxmox
          - talos
    defaults:
      run:
        working-directory: opentofu/stacks/${{ matrix.stack }}
    env:
      # Only used to satisfy the encryption block; validate never reads state.
      TF_VAR_state_passphrase: ci-validate-only-passphrase
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2

      - name: Format
        run: tofu fmt -check -recursive

      - name: Init
        run: tofu init -backend=false

      - name: Validate
        run: tofu validate
